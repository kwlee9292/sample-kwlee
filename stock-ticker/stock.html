<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 시세</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#191f28; --sub:#8b95a1; --up:#f04452; --down:#3182f6; --line:#e5e8eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101113; --card:#1b1d21; --text:#f2f4f6; --sub:#8b95a1; --up:#ff5b67; --down:#4b96ff; --line:#2b2e33; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:880px; margin:0 auto; padding:32px 16px; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  h1 { font-size:22px; margin:0; }
  #status { font-size:13px; color:var(--sub); }
  #status.err { color:var(--up); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; transition:background-color .6s; }
  .card .name { font-size:15px; font-weight:600; }
  .card .code { font-size:12px; color:var(--sub); margin-left:4px; font-weight:400; }
  .card .price { font-size:28px; font-weight:700; margin:12px 0 4px; font-variant-numeric:tabular-nums; }
  .card .chg { font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--sub); }
  .flash-up { background:color-mix(in srgb, var(--up) 14%, var(--card)); }
  .flash-down { background:color-mix(in srgb, var(--down) 14%, var(--card)); }
  footer { margin-top:20px; font-size:12px; color:var(--sub); }
</style>
</head>
<body>
<main>
  <header>
    <h1>실시간 시세</h1>
    <span id="status">불러오는 중…</span>
  </header>
  <div class="grid" id="grid"></div>
  <footer>데이터: 네이버 증권 · 5초마다 갱신 · 투자 판단의 근거로 사용하지 마세요.</footer>
</main>
<script>
const ORDER = ['KOSPI', 'KOSDAQ', '005930', '000660'];
const INTERVAL = 5000;
const last = {};
const fmt = (n, d) => n == null ? '-' : n.toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });

function cls(q) {
  if (/RISING|UPPER/.test(q.direction) || q.change > 0) return 'up';
  if (/FALLING|LOWER/.test(q.direction) || q.change < 0) return 'down';
  return 'flat';
}

function render(quotes) {
  const grid = document.getElementById('grid');
  quotes.sort((a, b) => ORDER.indexOf(a.code) - ORDER.indexOf(b.code));
  for (const q of quotes) {
    let card = document.getElementById('c-' + q.code);
    if (!card) {
      card = document.createElement('div');
      card.className = 'card';
      card.id = 'c-' + q.code;
      card.innerHTML = '<div class="name"></div><div class="price"></div><div class="chg"></div>';
      grid.appendChild(card);
    }
    const d = q.type === 'index' ? 2 : 0;
    const c = cls(q);
    const arrow = c === 'up' ? '▲' : c === 'down' ? '▼' : '';
    card.querySelector('.name').innerHTML = `${q.name}<span class="code">${q.type === 'stock' ? q.code : ''}</span>`;
    card.querySelector('.price').textContent = fmt(q.price, d);
    const chg = card.querySelector('.chg');
    chg.className = 'chg ' + c;
    chg.textContent = `${arrow} ${fmt(Math.abs(q.change), d)} (${q.rate > 0 ? '+' : ''}${fmt(q.rate, 2)}%)`;

    const prev = last[q.code];
    if (prev != null && prev !== q.price) {
      card.classList.add(q.price > prev ? 'flash-up' : 'flash-down');
      setTimeout(() => card.classList.remove('flash-up', 'flash-down'), 600);
    }
    last[q.code] = q.price;
  }
}

// 서버 없이 더블클릭으로 열 수 있도록 두 가지 방법을 순서대로 시도한다.
// 1) 네이버 구 폴링 API의 JSONP(<script> 태그로 불러오므로 CORS에 막히지 않음)
// 2) 무료 공개 CORS 프록시를 거친 신 폴링 API
const NAVER = 'https://polling.finance.naver.com/api/realtime/domestic';
const URLS = [`${NAVER}/stock/005930,000660`, `${NAVER}/index/KOSPI`, `${NAVER}/index/KOSDAQ`];
const NAMES = { '005930': '삼성전자', '000660': 'SK하이닉스', KOSPI: '코스피', KOSDAQ: '코스닥' };
const PROXIES = [
  (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  (u) => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u),
];
let proxyIdx = 0;
let method = 'jsonp';
const num = (v) => (v == null ? null : Number(String(v).replace(/,/g, '')));
const RF = { 1: 'UPPER_LIMIT', 2: 'RISING', 3: 'EVEN', 4: 'LOWER_LIMIT', 5: 'FALLING' };

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = '__cb' + Date.now() + Math.floor(Math.random() * 1e6);
    const s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { done(); reject(new Error('JSONP 시간 초과')); }, 5000);
    window[cb] = (data) => { done(); resolve(data); };
    s.onerror = () => { done(); reject(new Error('JSONP 로드 실패')); };
    s.charset = 'euc-kr';
    s.src = url + (url.includes('?') ? '&' : '?') + '_callback=' + cb + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}

async function viaJsonp() {
  const q = 'SERVICE_ITEM:005930,000660|SERVICE_INDEX:KOSPI,KOSDAQ';
  const r = await jsonp('https://polling.finance.naver.com/api/realtime.nhn?query=' + encodeURIComponent(q));
  const areas = (r.result && r.result.areas) || [];
  const quotes = areas.flatMap((area) => (area.datas || []).map((d) => {
    const isIndex = area.name === 'SERVICE_INDEX';
    // 지수는 100배 정수로 내려온다 (예: 258012 → 2580.12)
    const scale = isIndex && Math.abs(d.nv) > 20000 ? 100 : 1;
    const dir = RF[d.rf];
    const sign = /FALLING|LOWER/.test(dir) ? -1 : 1;
    return {
      type: isIndex ? 'index' : 'stock',
      code: d.cd,
      name: NAMES[d.cd] || d.nm,
      price: d.nv / scale,
      change: sign * Math.abs(d.cv) / scale,
      rate: sign * Math.abs(d.cr),
      direction: dir,
      marketStatus: d.ms,
    };
  }));
  if (!quotes.length) throw new Error('JSONP 데이터 없음');
  return quotes;
}

async function getJson(u) {
  for (let i = 0; i < PROXIES.length; i++) {
    const idx = (proxyIdx + i) % PROXIES.length;
    try {
      const res = await fetch(PROXIES[idx](u), { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const json = await res.json();
      proxyIdx = idx;
      return json;
    } catch (e) { /* 다음 프록시 시도 */ }
  }
  throw new Error('프록시 접속 실패');
}

async function viaProxy() {
  const results = await Promise.all(URLS.map(getJson));
  const quotes = results.flatMap((r, i) => (r.datas || []).map((d) => ({
    type: i === 0 ? 'stock' : 'index',
    code: d.itemCode,
    name: NAMES[d.itemCode] || d.stockName,
    price: num(d.closePrice),
    change: num(d.compareToPreviousClosePrice),
    rate: num(d.fluctuationsRatio),
    direction: d.compareToPreviousPrice && d.compareToPreviousPrice.name,
    marketStatus: d.marketStatus,
  })));
  if (!quotes.length) throw new Error('프록시 데이터 없음');
  return quotes;
}

async function load() {
  const order = method === 'jsonp' ? [['jsonp', viaJsonp], ['proxy', viaProxy]] : [['proxy', viaProxy], ['jsonp', viaJsonp]];
  const errors = [];
  for (const [name, fn] of order) {
    try { const q = await fn(); method = name; return q; }
    catch (e) { errors.push(e.message); }
  }
  throw new Error(errors.join(' / '));
}

async function tick() {
  const status = document.getElementById('status');
  try {
    const quotes = await load();
    render(quotes);
    const market = quotes[0].marketStatus;
    const label = { OPEN: '장중', CLOSE: '장 마감', PREOPEN: '장 시작 전', CLOSED: '장 마감' }[market] || market || '';
    status.className = '';
    status.textContent = `${label} · ${new Date().toLocaleTimeString('ko-KR')} 기준 (${method === 'jsonp' ? '직접' : '프록시'})`;
  } catch (e) {
    status.className = 'err';
    status.textContent = '불러오기 실패: ' + e.message;
  } finally {
    setTimeout(tick, INTERVAL);
  }
}
tick();
</script>
</body>
</html>
